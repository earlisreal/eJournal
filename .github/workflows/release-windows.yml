name: Release (Windows)

# The active public pipeline intentionally builds Windows only. The former Linux/macOS workflow is
# retained under .github/workflows-disabled until those platforms are deliberately restored.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Required numeric package version (major.minor.patch)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Gradle bootstrap)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Derive app version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref_name }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            if ($env:VERSION_INPUT -eq "") { throw "workflow_dispatch requires version=MAJOR.MINOR.PATCH" }
            if ($env:VERSION_INPUT -notmatch '^\d+\.\d+\.\d+$') { throw "version must be major.minor.patch" }
            $v = $env:VERSION_INPUT
          } elseif ($env:EVENT_NAME -eq "push" -and $env:RELEASE_REF -match '^v(\d+\.\d+\.\d+)$') {
            $v = $Matches[1]
          } else {
            throw "release tags must match vX.Y.Z"
          }
          Write-Host "packageVersion = $v"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Test and build signed-candidate MSI
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: .\gradlew.bat :shared:jvmTest build :desktopApp:packageMsi "-PappVersion=$env:APP_VERSION" -PofficialRelease=true -Pdistribution=msi --no-configuration-cache --stacktrace

      - name: Build portable candidate with portable identity
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: .\gradlew.bat :desktopApp:createDistributable :desktopApp:writeWindowsRuntimeInventory "-PappVersion=$env:APP_VERSION" -PofficialRelease=true -Pdistribution=portable --no-configuration-cache --stacktrace

      - name: Verify checked-in runtime inventory
        shell: pwsh
        run: |
          git diff --exit-code -- licenses/windows-runtime-components.txt

      - name: Inspect Windows package contents
        shell: pwsh
        run: |
          $appRoot = "desktopApp/build/compose/binaries/main/app"
          $appDir = Get-ChildItem -LiteralPath $appRoot -Directory | Select-Object -First 1
          if (-not $appDir) { throw "Packaged Windows app image not found" }
          $forbidden = Get-ChildItem -LiteralPath $appDir.FullName -Recurse -File |
            Where-Object { $_.Name -match '(?i)moomoo|protobuf|opend(\.exe)?$' }
          if ($forbidden) { throw "Forbidden Moomoo SDK/protobuf/OpenD content found in packaged Windows files" }
          $jar = Join-Path $env:JAVA_HOME "bin\jar.exe"
          foreach ($archive in Get-ChildItem -LiteralPath $appDir.FullName -Recurse -Filter *.jar) {
            $entries = & $jar tf $archive.FullName
            if ($entries -match '(^|/)(com/moomoo|com/futu|com/google/protobuf|protobuf)(/|\.)') {
              throw "Forbidden Moomoo SDK/protobuf classes found in $($archive.Name)"
            }
          }

          $msi = Get-ChildItem -Path "desktopApp/build/compose/binaries/main/msi" -Recurse -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw "Packaged Windows MSI not found" }
          $inspection = Join-Path $env:RUNNER_TEMP ("ejournal-msi-inspection-" + [Guid]::NewGuid())
          New-Item -ItemType Directory -Path $inspection | Out-Null
          $extract = Start-Process -FilePath msiexec.exe -ArgumentList "/a `"$($msi.FullName)`" /qn TARGETDIR=`"$inspection`"" -Wait -PassThru
          if ($extract.ExitCode -ne 0) { throw "MSI administrative extraction failed with exit code $($extract.ExitCode)" }
          $msiForbidden = Get-ChildItem -LiteralPath $inspection -Recurse -File |
            Where-Object { $_.Name -match '(?i)moomoo|protobuf|opend(\.exe)?$' }
          if ($msiForbidden) { throw "Forbidden Moomoo SDK/protobuf/OpenD content found in MSI" }
          foreach ($archive in Get-ChildItem -LiteralPath $inspection -Recurse -Filter *.jar) {
            $entries = & $jar tf $archive.FullName
            if ($entries -match '(^|/)(com/moomoo|com/futu|com/google/protobuf|protobuf)(/|\.)') {
              throw "Forbidden Moomoo SDK/protobuf classes found in MSI archive $($archive.Name)"
            }
          }

      - name: Stage release artifacts
        shell: pwsh
        run: |
          $appRoot = "desktopApp/build/compose/binaries/main/app"
          $appDir = Get-ChildItem -LiteralPath $appRoot -Directory | Select-Object -First 1
          Compress-Archive -Path $appDir.FullName -DestinationPath "eJournal-portable-windows.zip" -Force

          $msi = Get-ChildItem -Path "desktopApp/build/compose/binaries/main/msi" -Recurse -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw "Packaged Windows MSI not found" }
          Copy-Item $msi.FullName -Destination "eJournal-windows.msi"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ejournal-windows
          path: |
            eJournal-portable-windows.zip
            eJournal-windows.msi

  publish-windows:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && needs.build-windows.result == 'success'
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ejournal-windows

      - name: Publish Windows assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GH_REPO" --verify-tag --title "eJournal $TAG" --generate-notes \
              || gh release view "$TAG" --repo "$GH_REPO"
          fi
          gh release upload "$TAG" eJournal-portable-windows.zip eJournal-windows.msi --repo "$GH_REPO" --clobber
          notes="$RUNNER_TEMP/release-notes.md"
          gh release view "$TAG" --repo "$GH_REPO" --json body --jq .body > "$notes"
          {
            echo
            echo "### Windows release"
            echo "This release is not Authenticode-signed yet. The unsigned build only checks for updates and opens GitHub; it never downloads or installs an MSI automatically."
            echo "OpenD is a separate local prerequisite for Moomoo synchronization; no Moomoo SDK is bundled."
            echo "Market-data requests are opt-in and off by default."
            echo "See the [code-signing policy](https://github.com/earlisreal/eJournal/blob/main/CODE_SIGNING_POLICY.md) and [privacy policy](https://github.com/earlisreal/eJournal/blob/main/PRIVACY.md)."
          } >> "$notes"
          gh release edit "$TAG" --repo "$GH_REPO" --notes-file "$notes"
          {
            echo "### Windows"
            echo "Published eJournal-windows.msi and eJournal-portable-windows.zip."
          } >> "$GITHUB_STEP_SUMMARY"
